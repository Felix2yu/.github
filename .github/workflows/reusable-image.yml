name: Reusable · Image

# 统一的镜像构建流程：CI 预编译二进制 + Dockerfile 只做装配 + 双架构 manifest 合并。
#
# 为什么预编译而不是在 Dockerfile 里编译：
#   镜像构建从 ~10min 降到 ~1min；镜像内不再需要 Go / Node 工具链；
#   二进制在 runner 上编，缓存命中率高，且能在推送前做 glibc 校验。
#
# CGO 形态（inputs.cgo）：
#   off    —— 纯 Go，CGO_ENABLED=0，可交叉编译（12 个仓库）。
#             但 CGO off 不保证静态：依赖里若有 //go:linkname 到 libc 符号的可选绑定
#             （purego 那类 dlopen），产物照样带 INTERP，所以这条形态也过 INTERP 守卫
#   glibc  —— CGO + glibc 动态链接，必须在固定 glibc 的容器里编译（幕间 mujian）
#   static —— CGO + 完全静态链接，扔进 alpine 也能跑（ntfy）
#
# 差异用三条互斥 step 表达，而不是多个 job：
#   独立 job 会引入 needs 跳过语义（被 if 跳过的 job 会连带跳过下游），
#   而条件 step 让 90% 的仓库「零感知」——它们的 job 里只有一条 step 命中。

on:
  workflow_call:
    inputs:
      go-dir:
        type: string
        default: '.'
      main-package:
        type: string
        default: '.'
        description: '相对 go-dir'
      binary-name:
        type: string
        required: true
      image-name:
        type: string
        required: true
        description: '如 ghcr.io/felix2yu/shenshi。不用 github.repository 推导——reusable workflow 里它指向本仓库'
      cgo:
        type: string
        default: 'off'
        description: 'off | glibc | static'
      build-tags:
        type: string
        default: ''
        description: '传给 go build 的 -tags，空格分隔。ntfy = sqlite_omit_load_extension osusergo netgo'
      static-ldflags:
        type: string
        default: '-linkmode=external -extldflags=-static'
        description: 'cgo=static 时在 build-ldflags 之后追加的链接选项。CGO 完全静态链接才能在 alpine/musl 上跑'
      static-verify-command:
        type: string
        default: ''
        description: 'cgo=static 或 off 编译后的额外校验命令；非空则以它退出码为准。默认为校验二进制无 INTERP 段（真静态）'
      dockerfile:
        type: string
        default: 'Dockerfile'
      context:
        type: string
        default: '.'
      prebuilt-dest:
        type: string
        default: 'bin'
        description: '预编译二进制落到 Docker 上下文的位置'
      build-ldflags:
        type: string
        default: '-s -w'
      web-dir:
        type: string
        default: ''
      node-version-file:
        type: string
        default: '.nvmrc'
        description: '仓库根相对路径。读不到就直接失败，不设兜底版本'
      web-build-command:
        type: string
        default: ''
        description: '非空则替换默认的 pnpm run build；依赖仍由本流程统一安装'
      frontend-stage-command:
        type: string
        default: ''
        description: '在仓库根执行：把前端产物摆到 go:embed 位置，和/或 dist/ 供 Dockerfile COPY'
      runner-amd64:
        type: string
        default: 'ubuntu-26.04'
      runner-arm64:
        type: string
        default: 'ubuntu-26.04-arm'
      build-args:
        type: string
        default: ''
      docs-command:
        type: string
        default: ''
        description: '在仓库根执行，编译二进制之前。生成 npm 之外的前置产物（如 ntfy 的 mkdocs 文档 → server/docs）。命令须自行保证幂等'
      docs-cache-path:
        type: string
        default: ''
        description: '非空则对该路径做 actions/cache（如 ~/.cache/pip）。纯加速用，命令本身须保证无缓存也能跑通'
      docs-cache-key-files:
        type: string
        default: 'requirements.txt'
        description: '逗号分隔的仓库根 glob，参与 docs 缓存 key'
      docs-python:
        type: string
        default: 'python3'
        description: '注入给 docs-command 的 $PYTHON'
      push-images:
        type: boolean
        default: true

jobs:
  docker:
    # 权限只能向下收紧，不能提升：调用方 job 必须自己声明 packages: write
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runs-on: '${{ inputs.runner-amd64 }}' }
          - { platform: linux/arm64, arch: arm64, runs-on: '${{ inputs.runner-arm64 }}' }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      # >>> pm-resolve
      - name: Check frontend toolchain declaration
        if: inputs.web-dir != ''
        shell: bash
        working-directory: ${{ inputs.web-dir }}
        run: |
          # 只读 packageManager 声明，不探测 lockfile。
          # 用 sed 而非 jq：binaries-matrix 会在 macos / windows runner 上跑同一段。
          [ -f package.json ] || { echo "::error::找不到 ${{ inputs.web-dir }}/package.json"; exit 1; }
          spec=$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -1)
          case "$spec" in
            pnpm@[0-9]*) ver=${spec#*@}; ver=${ver%%[+?]*} ;;
            bun@*) echo "::error::packageManager 为 $spec：本流程只支持 pnpm（setup-node 不缓存 bun）"; exit 1 ;;
            npm@*) echo "::error::packageManager 为 $spec：本流程只支持 pnpm，请迁移该工程"; exit 1 ;;
            *)
              echo "::error::${{ inputs.web-dir }}/package.json 缺 packageManager 字段"
              echo '修复：cd ${{ inputs.web-dir }}，在 "name" 之后插入一行：  "packageManager": "pnpm@11.22.0",'
              exit 1 ;;
          esac
          [ -f pnpm-lock.yaml ] || { echo "::error::${{ inputs.web-dir }} 缺 pnpm-lock.yaml，提交前执行 pnpm install --lockfile-only"; exit 1; }
          echo "pnpm $ver ← ${{ inputs.web-dir }}/package.json 的 packageManager"
      # <<< pm-resolve

      # pnpm 版本由 packageManager 字段决定（action 自己读），store 缓存挂在 pnpm 侧而非 setup-node 侧
      - uses: pnpm/action-setup@v6
        if: inputs.web-dir != ''
        with:
          package_json_file: ${{ inputs.web-dir }}/package.json
          cache: true
          # 这个 action 的输入是下划线风格（不是 setup-node 的连字符写法）；写成 cache-dependency-path
          # 会被 runner 当 Unexpected input 静默忽略，退回默认的仓库根 pnpm-lock.yaml。
          # 本仓群的锁在 web/ frontend/ site/ 子目录，hashFiles 解析不到时 action 直接抛
          # 「Some specified paths were not resolved」，整个 image job 红。
          cache_dependency_path: ${{ inputs.web-dir }}/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        if: inputs.web-dir != ''
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-dir }}/go.mod
          cache-dependency-path: ${{ inputs.go-dir }}/go.sum

      # >>> web-install
      - name: Install & build frontend
        if: inputs.web-dir != ''
        shell: bash
        working-directory: ${{ inputs.web-dir }}
        run: |
          # 依赖始终由本步安装；web-build-command 只替换构建命令，
          # 否则传了该命令的仓库会在没有 node_modules 的情况下执行它。
          pnpm install --frozen-lockfile
          if [ -n "${{ inputs.web-build-command }}" ]; then
            eval "${{ inputs.web-build-command }}"
          else
            pnpm run build
          fi
      # <<< web-install

      # hashFiles() 不接受逗号分隔的多值（会整体当成一个字面 pattern 而匹配不到），
      # 所以这里先在 bash 里把 docs-cache-key-files 拆成多个 pattern 分别求值。
      - name: Resolve docs cache key
        id: docskey
        if: inputs.docs-command != '' && inputs.docs-cache-path != ''
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra pats <<< "${{ inputs.docs-cache-key-files }}"
          h=""
          for p in "${pats[@]}"; do
            p="$(printf '%s' "$p" | tr -d '[:space:]')"
            [ -n "$p" ] || continue
            if [ -f "$p" ]; then
              h="${h}_$(printf '%s' "$p" | tr -c '[:alnum:]._-' '_')-$(sha256sum "$p" | cut -c1-16)"
            else
              h="${h}_$(printf '%s' "$p" | tr -c '[:alnum:]._-' '_')-missing"
            fi
          done
          [ -n "$h" ] || h="nohash"
          echo "key=docs-${{ runner.os }}-${{ matrix.arch }}-$h" >> "$GITHUB_OUTPUT"

      - name: Restore docs cache
        if: inputs.docs-command != '' && inputs.docs-cache-path != ''
        uses: actions/cache@v6
        with:
          path: ${{ inputs.docs-cache-path }}
          key: ${{ steps.docskey.outputs.key }}

      - name: Build docs assets
        if: inputs.docs-command != ''
        shell: bash
        env:
          PYTHON: ${{ inputs.docs-python }}
        run: ${{ inputs.docs-command }}

      # 与 web-dir 解耦：非 npm 前端（如 chaxin 的 sh web/build.sh）没有 web-dir，
      # 但同样需要在编译前生成 go:embed 依赖物。
      - name: Stage frontend assets
        if: inputs.frontend-stage-command != ''
        run: ${{ inputs.frontend-stage-command }}

      # ---------------- CGO 形态：三条互斥 step ----------------

      - name: Build binary (static)
        if: inputs.cgo == 'off'
        working-directory: ${{ inputs.go-dir }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/${{ inputs.prebuilt-dest }}"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -trimpath \
              -tags="${{ inputs.build-tags }}" \
              -ldflags="${{ inputs.build-ldflags }}" \
              -o "$GITHUB_WORKSPACE/${{ inputs.prebuilt-dest }}/${{ inputs.binary-name }}" \
              ${{ inputs.main-package }}

      # ntfy 专用。CGO 需要完全静态链接（-extldflags=-static）才能扔进 alpine：
      # 动态链接的产物在 musl 上启动即 "not found"，而 CI 全程是绿的。
      #
      # 刻意**不**用 golang:*-alpine 编译：alpine 镜像不含 gcc，要额外 apk add build-base，
      # 既多一个网络失败点，又与上游 Dockerfile-build（golang:1.25-bookworm 编、alpine 跑）
      # 不一致。全静态后二进制不依赖任何 libc，编译期用 glibc 还是 musl 都一样。
      - name: Build binary (CGO, fully static)
        if: inputs.cgo == 'static'
        working-directory: ${{ inputs.go-dir }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/${{ inputs.prebuilt-dest }}"
          CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -trimpath \
              -tags="${{ inputs.build-tags }}" \
              -ldflags="${{ inputs.build-ldflags }} ${{ inputs.static-ldflags }}" \
              -o "$GITHUB_WORKSPACE/${{ inputs.prebuilt-dest }}/${{ inputs.binary-name }}" \
              ${{ inputs.main-package }}

      # 真静态 = 没有 INTERP 段。少一个 -static 就会让产物在 alpine 上启动失败，
      # 而编译与测试全绿 —— 只能在这里钉住。cgo=off 同样要过：CGO_ENABLED=0 挡不住
      # 依赖里 //go:linkname 的 libc 符号（tuqie 的 avif 就是这么把 glibc INTERP 带进 musl 镜像的）。
      - name: Verify fully static
        if: (inputs.cgo == 'static' || inputs.cgo == 'off') && inputs.static-verify-command == ''
        run: |
          set -euo pipefail
          bin="${{ inputs.prebuilt-dest }}/${{ inputs.binary-name }}"
          command -v readelf >/dev/null || sudo apt-get install -y -q binutils
          if readelf -l "$bin" | grep -q 'INTERP'; then
            echo "::error::$bin 含 INTERP 段，不是完全静态链接；该产物无法在 alpine/musl 上运行。"
            if [ "${{ inputs.cgo }}" = "static" ]; then
              echo "检查 static-ldflags 是否包含 -extldflags=-static"
            else
              echo "CGO_ENABLED=0 也会被依赖里 //go:linkname 的 libc 符号拽住；用 build-tags 关掉那条可选绑定路径"
            fi
            readelf -l "$bin" | grep -A1 'INTERP' || true
            exit 1
          fi
          echo "✓ $bin 无 INTERP 段，完全静态"
          file "$bin" || true

      - name: Verify static (custom)
        if: (inputs.cgo == 'static' || inputs.cgo == 'off') && inputs.static-verify-command != ''
        run: ${{ inputs.static-verify-command }}

      # 幕间专用。CGO 把二进制绑死在编译机的 glibc 上；若直接在 runner 上编，
      # glibc 下限就成了 GitHub runner 轮换的属性，某次轮换后会突然炸。
      # 放进固定 glibc 的容器里编，下限就变回仓库自己的属性。
      - name: Build binary (glibc pinned container)
        if: inputs.cgo == 'glibc'
        working-directory: ${{ inputs.go-dir }}
        run: |
          modcache=$(go env GOMODCACHE)
          mkdir -p "$modcache" "$GITHUB_WORKSPACE/${{ inputs.prebuilt-dest }}"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src" -w "/src/${{ inputs.go-dir }}" \
            -v "$modcache:/go/pkg/mod" \
            -e HOME=/tmp -e GOCACHE=/tmp/gocache -e GOTOOLCHAIN=local -e CGO_ENABLED=1 \
            golang:1.27-bookworm \
            go build -trimpath -ldflags="${{ inputs.build-ldflags }}" \
              -o "/src/${{ inputs.prebuilt-dest }}/${{ inputs.binary-name }}" ${{ inputs.main-package }}

      # 幕间专用。glibc 只向后兼容：编译机 glibc 高于运行镜像 → 容器启动时
      # "GLIBC_2.x not found"，而 CI 全程是绿的。运行版本从 Dockerfile 读，
      # 升基镜像会自动放宽这条检查。
      - name: Verify glibc floor
        if: inputs.cgo == 'glibc'
        run: |
          set -euo pipefail
          command -v readelf >/dev/null || sudo apt-get install -y -q binutils
          base=$(awk '/^FROM[[:space:]]/{print $2; exit}' Dockerfile)
          bin="${{ inputs.prebuilt-dest }}/${{ inputs.binary-name }}"
          required=$(readelf -V "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1 || true)
          available=$(docker run --rm --entrypoint sh "$base" -c 'ldd --version | head -1' | awk '{print $NF}')
          echo "runtime image $base provides glibc $available; binary requires up to ${required:-none}"
          if [ -n "$required" ]; then
            newest=$(printf '%s\n%s\n' "$required" "$available" | sort -V | tail -1)
            if [ "$newest" != "$available" ]; then
              echo "::error::binary requires glibc $required but the runtime image ($base) only provides $available"
              echo "symbols needing GLIBC_$required:"
              objdump -T "$bin" | grep "GLIBC_$required" || true
              exit 1
            fi
          fi

      # ---------------- 镜像（三种 CGO 形态共用） ----------------

      - uses: docker/setup-buildx-action@v4

      # fork / Dependabot PR 的 token 只读且无 packages 权限，登录必失败
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (per-arch)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image-name }}
          tags: type=sha,format=long,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.push-images && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}-${{ matrix.arch }}
          build-args: ${{ inputs.build-args }}
          # 强制重解析基础镜像 tag：alpine:3.24 背后的 digest 变了就重建，
          # 这样每周空跑确实能把上游补丁带进来。
          pull: true
          # scope 必须带仓库维度：用 github.job 会让所有仓库共用同一份缓存
          cache-from: type=gha,scope=${{ inputs.binary-name }}-${{ matrix.arch }}
          cache-to:   type=gha,scope=${{ inputs.binary-name }}-${{ matrix.arch }},mode=max

  manifest:
    if: inputs.push-images && github.event_name != 'pull_request'
    needs: docker
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (final tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image-name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-

      - name: Create and push manifest lists
        run: |
          set -euo pipefail
          image="${{ inputs.image-name }}"
          refs="$image:sha-${{ github.sha }}-amd64 $image:sha-${{ github.sha }}-arm64"
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then continue; fi
            echo "→ $tag"
            docker buildx imagetools create -t "$tag" $refs
          done <<< "${{ steps.meta.outputs.tags }}"
