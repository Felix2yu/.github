name: Reusable · Test & Coverage

# 统一的 Go 测试 + Codecov 上报流程。
#
# 设计原则：
#   ① 工具链版本一律读声明文件（go.mod / .nvmrc），不在 workflow 里写死，
#      升级大版本只改声明，不必回来动 CI。
#   ② 包管理器自动识别，调用方无需关心 npm / pnpm / bun。
#   ③ 覆盖率上传永远 fail_ci_if_error=false：报告服务不是构建闸门，
#      fork PR 拿不到 token 时也不该拦住 CI。

on:
  workflow_call:
    inputs:
      go-dir:
        type: string
        default: '.'
        description: 'go.mod 所在目录'
      test-packages:
        type: string
        default: './...'
        description: '传给 go test 的包范围。main 包带 //go:embed 且不产前端时用 ./internal/...'
      test-flags:
        type: string
        default: '-covermode=atomic'
        description: '追加给 go test 的参数，如 -race'
      test-cgo:
        type: string
        default: ''
        description: '留空 = 沿用 runner 默认（1）。-race 与 CGO 依赖都要求 1，而测试产物不发布、静态与否无意义，所以默认不关掉它；确需关闭时填 0'
      vet:
        type: boolean
        default: true
      pre-test-command:
        type: string
        default: ''
        description: '在 go-dir 内执行，用于生成 go:embed 依赖物（如 chaxin 的 sh ../web/build.sh）'
      web-dir:
        type: string
        default: ''
        description: '前端目录；空 = 无前端'
      node-version-file:
        type: string
        default: '.nvmrc'
      node-version:
        type: string
        default: '22'
        description: '无 .nvmrc 时的兜底版本'
      package-manager:
        type: string
        default: 'auto'
        description: 'auto | npm | pnpm | bun'
      web-install-flags:
        type: string
        default: ''
        description: '如 qiansi 的 --legacy-peer-deps'
      web-build-command:
        type: string
        default: ''
        description: '非空则完全接管前端构建；空则用包管理器默认流程'
      web-test-command:
        type: string
        default: ''
        description: '如 huozhi 的 npm run test:coverage'
      coverage-file:
        type: string
        default: 'coverage.out'
        description: '相对 go-dir'
      frontend-coverage-file:
        type: string
        default: ''
        description: '前端覆盖率文件，相对仓库根'
      codecov-flag-go:
        type: string
        default: 'backend'
      codecov-flag-web:
        type: string
        default: 'frontend'
      codecov-disable-search:
        type: boolean
        default: false
        description: 'qiansi = true（避免把原生 coverage.out 一起上报）'
      runs-on:
        type: string
        default: 'ubuntu-24.04'
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 包管理器自动识别 —— 全流程唯一的判断点
      - name: Resolve package manager
        id: pm
        if: inputs.web-dir != ''
        working-directory: ${{ inputs.web-dir }}
        run: |
          case "${{ inputs.package-manager }}" in
            npm|pnpm|bun) pm="${{ inputs.package-manager }}" ;;
            *)
              if   [ -f pnpm-lock.yaml ] || [ -f pnpm-workspace.yaml ]; then pm=pnpm
              elif [ -f bun.lock ] || [ -f bun.lockb ];                then pm=bun
              else pm=npm; fi ;;
          esac
          case "$pm" in
            pnpm) lock="pnpm-lock.yaml" ;;
            bun)  lock="bun.lock" ;;
            *)    lock="package-lock.json" ;;
          esac
          echo "pm=$pm" >> "$GITHUB_OUTPUT"
          echo "lockfile=${{ inputs.web-dir }}/$lock" >> "$GITHUB_OUTPUT"

      - name: Check node version file
        id: nodever
        if: inputs.web-dir != ''
        run: |
          if [ -f "${{ inputs.node-version-file }}" ]; then
            echo "has-file=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-file=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: inputs.web-dir != '' && steps.pm.outputs.pm == 'pnpm'
        with:
          version: 11

      # 两个互斥的 setup-node：node-version-file 与 node-version 不能同时为空
      - uses: actions/setup-node@v7
        if: inputs.web-dir != '' && steps.nodever.outputs.has-file == 'true'
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}

      - uses: actions/setup-node@v7
        if: inputs.web-dir != '' && steps.nodever.outputs.has-file == 'false'
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-dir }}/go.mod
          cache-dependency-path: ${{ inputs.go-dir }}/go.sum

      - name: Install & build frontend
        if: inputs.web-dir != ''
        working-directory: ${{ inputs.web-dir }}
        run: |
          pm="${{ steps.pm.outputs.pm }}"
          flags="${{ inputs.web-install-flags }}"
          if [ -n "${{ inputs.web-build-command }}" ]; then
            eval "${{ inputs.web-build-command }}"
          else
            case "$pm" in
              pnpm) pnpm install --frozen-lockfile && pnpm run build ;;
              bun)  bun install --frozen-lockfile && bun run build ;;
              *)    npm ci $flags && npm run build ;;
            esac
          fi

      - name: Frontend tests
        if: inputs.web-test-command != ''
        working-directory: ${{ inputs.web-dir }}
        run: ${{ inputs.web-test-command }}

      - name: Pre-test setup
        if: inputs.pre-test-command != ''
        working-directory: ${{ inputs.go-dir }}
        run: ${{ inputs.pre-test-command }}

      - name: go vet
        if: inputs.vet
        working-directory: ${{ inputs.go-dir }}
        run: go vet ${{ inputs.test-packages }}

      - name: go test
        working-directory: ${{ inputs.go-dir }}
        run: |
          # 只在显式指定时才覆盖 CGO_ENABLED：默认沿用 runner 的 1，
          # 这样 -race（要求 cgo）与 CGO 依赖都能开箱工作。
          if [ -n "${{ inputs.test-cgo }}" ]; then
            export CGO_ENABLED="${{ inputs.test-cgo }}"
          fi
          go test ${{ inputs.test-flags }} -coverprofile=${{ inputs.coverage-file }} ${{ inputs.test-packages }}

      - name: Resolve coverage path
        id: cov
        run: |
          d="${{ inputs.go-dir }}"
          if [ "$d" = "." ]; then d=""; fi
          echo "go=${d:+$d/}${{ inputs.coverage-file }}" >> "$GITHUB_OUTPUT"

      - name: Upload Go coverage
        uses: codecov/codecov-action@v7
        with:
          files: ${{ steps.cov.outputs.go }}
          flags: ${{ inputs.codecov-flag-go }}
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: ${{ inputs.codecov-disable-search }}
          fail_ci_if_error: false

      - name: Upload frontend coverage
        if: inputs.frontend-coverage-file != ''
        uses: codecov/codecov-action@v7
        with:
          files: ${{ inputs.frontend-coverage-file }}
          flags: ${{ inputs.codecov-flag-web }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
