name: Reusable · Test & Coverage

# 统一的 Go 测试 + Codecov 上报流程。
#
# 设计原则：
#   ① 工具链版本一律读声明文件（go.mod / .nvmrc），不在 workflow 里写死，
#      升级大版本只改声明，不必回来动 CI。
#   ② 包管理器一律读 <web-dir>/package.json 的 packageManager 声明，缺失即 fail。
#      不探测 lockfile —— 静默兜底正是历史上双锁并存把 CI 带偏的成因。
#   ③ 覆盖率上传永远 fail_ci_if_error=false：报告服务不是构建闸门，
#      fork PR 拿不到 token 时也不该拦住 CI。

on:
  workflow_call:
    inputs:
      go-dir:
        type: string
        default: '.'
        description: 'go.mod 所在目录；留空 = 本仓库没有 Go 后端（如 WebMonitor 的 Python 后端），此时只跑前端部分'
      test-packages:
        type: string
        default: './...'
        description: '传给 go test 的包范围。main 包带 //go:embed 且不产前端时用 ./internal/...'
      test-flags:
        type: string
        default: '-covermode=atomic'
        description: '追加给 go test 的参数，如 -race'
      test-cgo:
        type: string
        default: ''
        description: '留空 = 沿用 runner 默认（1）。-race 与 CGO 依赖都要求 1，而测试产物不发布、静态与否无意义，所以默认不关掉它；确需关闭时填 0'
      vet:
        type: boolean
        default: true
      pre-test-command:
        type: string
        default: ''
        description: '在 go-dir 内执行，用于生成 go:embed 依赖物（如 chaxin 的 sh ../web/build.sh）'
      frontend-stage-command:
        type: string
        default: ''
        description: '在仓库根执行：把前端产物摆到 go:embed 位置。test-packages 含 main 包且 main 带 //go:embed 时必须设置'
      web-dir:
        type: string
        default: ''
        description: '前端目录；空 = 无前端'
      node-version-file:
        type: string
        default: '.nvmrc'
        description: '仓库根相对路径。读不到就直接失败，不设兜底版本'
      web-build-command:
        type: string
        default: ''
        description: '非空则替换默认的 `pnpm run build`；依赖仍由本流程统一 pnpm install --frozen-lockfile 安装'
      web-test-command:
        type: string
        default: ''
        description: '如 huozhi 的 pnpm run test:coverage'
      coverage-file:
        type: string
        default: 'coverage.out'
        description: '相对 go-dir'
      frontend-coverage-file:
        type: string
        default: ''
        description: '前端覆盖率文件，相对仓库根'
      codecov-flag-go:
        type: string
        default: 'backend'
      codecov-flag-web:
        type: string
        default: 'frontend'
      codecov-disable-search:
        type: boolean
        default: false
        description: 'qiansi = true（避免把原生 coverage.out 一起上报）'
      runs-on:
        type: string
        default: 'ubuntu-24.04'
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # >>> pm-resolve
      - name: Check frontend toolchain declaration
        if: inputs.web-dir != ''
        shell: bash
        working-directory: ${{ inputs.web-dir }}
        run: |
          # 只读 packageManager 声明，不探测 lockfile。
          # 用 sed 而非 jq：binaries-matrix 会在 macos / windows runner 上跑同一段。
          [ -f package.json ] || { echo "::error::找不到 ${{ inputs.web-dir }}/package.json"; exit 1; }
          spec=$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -1)
          case "$spec" in
            pnpm@[0-9]*) ver=${spec#*@}; ver=${ver%%[+?]*} ;;
            bun@*) echo "::error::packageManager 为 $spec：本流程只支持 pnpm（setup-node 不缓存 bun）"; exit 1 ;;
            npm@*) echo "::error::packageManager 为 $spec：本流程只支持 pnpm，请迁移该工程"; exit 1 ;;
            *)
              echo "::error::${{ inputs.web-dir }}/package.json 缺 packageManager 字段"
              echo '修复：cd ${{ inputs.web-dir }}，在 "name" 之后插入一行：  "packageManager": "pnpm@11.22.0",'
              exit 1 ;;
          esac
          [ -f pnpm-lock.yaml ] || { echo "::error::${{ inputs.web-dir }} 缺 pnpm-lock.yaml，提交前执行 pnpm install --lockfile-only"; exit 1; }
          echo "pnpm $ver ← ${{ inputs.web-dir }}/package.json 的 packageManager"
      # <<< pm-resolve

      # pnpm 版本由 packageManager 字段决定（action 自己读）。
      # store 缓存仍走 setup-node：这条在本仓群已验证多年，pnpm/action-setup 的 cache 输入没验过。
      - uses: pnpm/action-setup@v6
        if: inputs.web-dir != ''
        with:
          package_json_file: ${{ inputs.web-dir }}/package.json

      - uses: actions/setup-node@v7
        if: inputs.web-dir != ''
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.web-dir }}/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        if: inputs.go-dir != ''
        with:
          go-version-file: ${{ inputs.go-dir }}/go.mod
          cache-dependency-path: ${{ inputs.go-dir }}/go.sum

      # >>> web-install
      - name: Install & build frontend
        if: inputs.web-dir != ''
        shell: bash
        working-directory: ${{ inputs.web-dir }}
        run: |
          # 依赖始终由本步安装；web-build-command 只替换构建命令，
          # 否则传了该命令的仓库会在没有 node_modules 的情况下执行它。
          pnpm install --frozen-lockfile
          if [ -n "${{ inputs.web-build-command }}" ]; then
            eval "${{ inputs.web-build-command }}"
          else
            pnpm run build
          fi
      # <<< web-install

      - name: Frontend tests
        if: inputs.web-test-command != ''
        working-directory: ${{ inputs.web-dir }}
        run: ${{ inputs.web-test-command }}

      - name: Pre-test setup
        if: inputs.pre-test-command != ''
        working-directory: ${{ inputs.go-dir }}
        run: ${{ inputs.pre-test-command }}

      - name: Stage frontend assets
        if: inputs.frontend-stage-command != ''
        run: ${{ inputs.frontend-stage-command }}

      - name: go vet
        if: inputs.go-dir != '' && inputs.vet
        working-directory: ${{ inputs.go-dir }}
        run: go vet ${{ inputs.test-packages }}

      - name: go test
        if: inputs.go-dir != ''
        working-directory: ${{ inputs.go-dir }}
        run: |
          # 只在显式指定时才覆盖 CGO_ENABLED：默认沿用 runner 的 1，
          # 这样 -race（要求 cgo）与 CGO 依赖都能开箱工作。
          if [ -n "${{ inputs.test-cgo }}" ]; then
            export CGO_ENABLED="${{ inputs.test-cgo }}"
          fi
          go test ${{ inputs.test-flags }} -coverprofile=${{ inputs.coverage-file }} ${{ inputs.test-packages }}

      - name: Resolve coverage path
        id: cov
        if: inputs.go-dir != ''
        run: |
          d="${{ inputs.go-dir }}"
          if [ "$d" = "." ]; then d=""; fi
          echo "go=${d:+$d/}${{ inputs.coverage-file }}" >> "$GITHUB_OUTPUT"

      - name: Upload Go coverage
        if: inputs.go-dir != ''
        uses: codecov/codecov-action@v7
        with:
          files: ${{ steps.cov.outputs.go }}
          flags: ${{ inputs.codecov-flag-go }}
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: ${{ inputs.codecov-disable-search }}
          fail_ci_if_error: false

      - name: Upload frontend coverage
        if: inputs.frontend-coverage-file != ''
        uses: codecov/codecov-action@v7
        with:
          files: ${{ inputs.frontend-coverage-file }}
          flags: ${{ inputs.codecov-flag-web }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
