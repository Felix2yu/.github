name: Self Test

# 公共仓库自身的门禁：改契约必须先让这里绿。
# actionlint 会校验 YAML 语法、表达式合法性、action 版本引用，
# 避免把一个语法错误推到 v1 tag 上、一次性打断 13 个仓库的 CI。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12

      - name: Lint workflows
        run: ./actionlint -color -shellcheck= -pyflakes=

      # 包管理器解析块与前端安装块在三个 workflow 里有 4 份物理副本，靠本仓库内的一致性检查钉住。
      # 本地改完先跑 `bash scripts/check-pm-blocks.sh`，别把偏离推到 v1 tag 上。
      - name: Check duplicated pm blocks are byte-identical
        run: bash scripts/check-pm-blocks.sh
