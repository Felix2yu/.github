name: Self Test

# 公共仓库自身的门禁：改契约必须先让这里绿。
# actionlint 会校验 YAML 语法、表达式合法性、action 版本引用，
# 避免把一个语法错误推到 v1 tag 上、一次性打断 13 个仓库的 CI。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7

      - name: Lint workflows
        run: ./actionlint -color -shellcheck= -pyflakes=
